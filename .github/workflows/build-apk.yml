name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            mkdir -p signing
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > signing/streamy.jks
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 absent : signature debug, mises à jour impossibles"
          fi

      - name: Build debug APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StreamyAuto-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StreamyAuto-apk
          path: StreamyAuto-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StreamyAuto build ${{ github.run_number }}
          body: APK debug compilée automatiquement depuis ${{ github.sha }}.
          files: StreamyAuto-${{ github.run_number }}.apk
